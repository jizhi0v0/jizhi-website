name: Claude Code Review

# 仅在开 PR / 向 PR 分支 push 新 commit 时自动审查。
# 个人单人仓库下，等价于「只有我 push 到 PR 分支才会触发」；
# 不会被 @claude 评论触发，也不会审查直接 push 到 main（无 PR）的提交。
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # 用 Max 订阅额度（OAuth token），非 API key 计费。
          # token 由本地 `claude setup-token` 生成，存入仓库 secret。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-7
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            请审查这个 PR 的改动，用简体中文输出，对具体问题给出可落地的修改建议。
            重点关注：
            1. 逻辑错误与潜在 bug（含边界条件、冷启动/首次使用、异步取消与状态覆盖）
            2. 安全问题
            3. 性能与不必要的重复渲染/计算
            4. 可复用与简化机会
            没有实质问题时直接说明通过，不要凑数。
