name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      # 字体子集的守门人：拿真实渲染结果比对已提交的 scripts/glyphs-heavy.txt。
      # 内容或 globals.css 的字重规则一变（比如新加一条 font-weight: 600），
      # 这里就会红——否则那些字只会在标题里悄悄掉到系统衬线，review 时看不出来。
      - name: Check heavy-weight glyph coverage
        run: bun run glyphs:check

      - name: Run E2E tests
        run: bun run test

      # 失败时上传 HTML 报告 + trace，便于本地 `npx playwright show-report` 回放现场
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
